name: apply-sniper-dashboard-ux-fix

on:
  push:
    branches:
      - ui/schedule-sniper-dashboard

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/schedule-sniper-dashboard
          fetch-depth: 0
      - name: Apply follow-up corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/screens/dashboard_screen.dart')
          text = path.read_text()

          old = """    final isLiveJob =\n        isSniper ? isLiveSniperJob(job) : isLiveJob;"""
          new = """    final isLiveJob =\n        isSniper ? isLiveSniperJob(job) : job.status == 'active';"""
          if old not in text:
              raise SystemExit('missing recursive isLiveJob source')
          text = text.replace(old, new, 1)

          old = """                          tooltip: 'Delete Job',\n                          onPressed: () async {"""
          new = """                          tooltip: isSniper && isLiveJob\n                              ? 'Scheduled sniper cannot be deleted while active'\n                              : 'Delete Job',\n                          onPressed: isSniper && isLiveJob ? null : () async {"""
          if old not in text:
              raise SystemExit('missing delete button source')
          text = text.replace(old, new, 1)

          old = """                            'Sniper paused — arm it to schedule',"""
          new = """                            isSniper\n                                ? 'Sniper paused — arm it to schedule'\n                                : 'Job Paused',"""
          if old not in text:
              raise SystemExit('missing paused label source')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/dashboard_screen.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix scheduled sniper dashboard state handling"
          git push origin HEAD:ui/schedule-sniper-dashboard
