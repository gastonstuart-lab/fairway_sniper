name: run-current-build-ui-audit-on-pr

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute audited patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-current-build-ui-audit.yml').read_text()
          marker = "python3 <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('embedded patch script not found')
          body = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(body), '<ui-audit-patch>', 'exec'))
          PY
          rm -f .github/workflows/run-current-build-ui-audit-on-pr.yml
          rm -f UI_AUDIT_TRIGGER.md

      - name: Commit audit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix current-build UI readability and live-job affordances"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
