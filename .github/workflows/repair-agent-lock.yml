name: repair-agent-lock

on:
  push:
    branches:
      - copilot/production-proof-fairway-sniper

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/production-proof-fairway-sniper
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate npm lock metadata
        working-directory: agent
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove npm ci now works
        working-directory: agent
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Remove one-off workflow
        run: rm .github/workflows/repair-agent-lock.yml
      - name: Commit repaired lock back to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/package-lock.json .github/workflows/repair-agent-lock.yml
          git diff --cached --check
          git commit -m "fix: repair agent npm lockfile for reproducible deploys"
          git push origin HEAD:copilot/production-proof-fairway-sniper
