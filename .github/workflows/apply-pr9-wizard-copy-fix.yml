name: apply-pr9-wizard-copy-fix

on:
  push:
    branches:
      - ui/schedule-sniper-dashboard

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/schedule-sniper-dashboard
          fetch-depth: 0
      - name: Update final wizard copy
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('lib/screens/sniper_job_wizard.dart')
          text = path.read_text()
          old = "'Job saved as draft / paused. It will not contact BRS until armed.',"
          new = "'Completing this will schedule the sniper with production immediately.',"
          if old not in text:
              raise SystemExit('old paused review copy not found')
          text = text.replace(old, new, 1)
          old2 = "child: const Text('Save',\n                style: TextStyle("
          new2 = "child: const Text('Schedule',\n                style: TextStyle("
          if old2 not in text:
              raise SystemExit('app bar Save control not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text)
          PY
      - name: Commit copy update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/sniper_job_wizard.dart
          git commit -m "Make wizard completion clearly schedule the sniper"
          git push origin HEAD:ui/schedule-sniper-dashboard
