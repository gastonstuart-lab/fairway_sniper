name: apply-dashboard-fix

on:
  push:
    branches:
      - copilot/production-proof-fairway-sniper

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/production-proof-fairway-sniper
      - name: Apply Flutter compile fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/dashboard_screen.dart')
          text = path.read_text(encoding='utf-8')

          old = """    final prepTimerId = data['timerDetails'] is Map
              ? ((data['timerDetails'] as Map)['prepTimer'] as Map?)?['timerId']
              : null;
          final fireTimerId = data['timerDetails'] is Map
              ? ((data['timerDetails'] as Map)['fireTimer'] as Map?)?['timerId']
              : null;
          """
          new = """    final timerDetails = data['timerDetails'];
          final prepTimer = timerDetails is Map ? timerDetails['prepTimer'] : null;
          final fireTimer = timerDetails is Map ? timerDetails['fireTimer'] : null;
          final prepTimerId = prepTimer is Map ? prepTimer['timerId'] : null;
          final fireTimerId = fireTimer is Map ? fireTimer['timerId'] : null;
          """

          if old not in text:
              raise SystemExit('Expected timer-details block not found; refusing blind patch')
          text = text.replace(old, new, 1)

          marker = "  Future<void> _runSafeProductionProof(List<BookingJob> jobs) async {\n"
          helper = """  void _showSnack(String message) {
            if (!mounted) return;
            ScaffoldMessenger.of(context).showSnackBar(
              SnackBar(content: Text(message)),
            );
          }

          """
          if 'void _showSnack(String message)' not in text:
              if marker not in text:
                  raise SystemExit('Safe production proof method marker not found')
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-off fixer workflow
        run: rm .github/workflows/apply-dashboard-fix.yml
      - name: Commit fix back to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/dashboard_screen.dart .github/workflows/apply-dashboard-fix.yml
          git diff --cached --check
          git commit -m "fix: make production proof dashboard compile"
          git push origin HEAD:copilot/production-proof-fairway-sniper
