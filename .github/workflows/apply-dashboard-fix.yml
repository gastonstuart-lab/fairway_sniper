name: apply-dashboard-fix

on:
  push:
    branches:
      - copilot/production-proof-fairway-sniper

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/production-proof-fairway-sniper
      - name: Apply Flutter compile fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/dashboard_screen.dart')
          text = path.read_text(encoding='utf-8')

          start_marker = "    final prepTimerId = data['timerDetails'] is Map\n"
          end_marker = "    final shortId = jobId.length <= 6 ? jobId : jobId.substring(0, 6);\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Expected timer-details region not found; refusing blind patch')

          replacement = """    final timerDetails = data['timerDetails'];
          final prepTimer = timerDetails is Map ? timerDetails['prepTimer'] : null;
          final fireTimer = timerDetails is Map ? timerDetails['fireTimer'] : null;
          final prepTimerId = prepTimer is Map ? prepTimer['timerId'] : null;
          final fireTimerId = fireTimer is Map ? fireTimer['timerId'] : null;
          """
          text = text[:start] + replacement + text[end:]

          method_marker = "  Future<void> _runSafeProductionProof(List<BookingJob> jobs) async {\n"
          helper = """  void _showSnack(String message) {
            if (!mounted) return;
            ScaffoldMessenger.of(context).showSnackBar(
              SnackBar(content: Text(message)),
            );
          }

          """
          if 'void _showSnack(String message)' not in text:
              if method_marker not in text:
                  raise SystemExit('Safe production proof method marker not found')
              text = text.replace(method_marker, helper + method_marker, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-off fixer workflow
        run: rm .github/workflows/apply-dashboard-fix.yml
      - name: Commit fix back to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/dashboard_screen.dart .github/workflows/apply-dashboard-fix.yml
          git diff --cached --check
          git commit -m "fix: make production proof dashboard compile"
          git push origin HEAD:copilot/production-proof-fairway-sniper
