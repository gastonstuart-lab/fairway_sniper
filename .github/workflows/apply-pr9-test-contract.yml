name: apply-pr9-test-contract

on:
  push:
    branches:
      - ui/schedule-sniper-dashboard

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/schedule-sniper-dashboard
          fetch-depth: 0
      - name: Update readiness contract for truthful dashboard labels
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('agent/tests/production_readiness_contract.test.js')
          text = path.read_text()
          old = """test('dashboard does not confirm armed sniper without both production timers', () => {\n  assert(dashboardSource.includes(\"data['hasPrepTimer'] != true || data['hasFireTimer'] != true\"));\n  assert(dashboardSource.includes('Production agent has not registered both PREP and FIRE timers yet.'));\n  assert(dashboardSource.includes('Waiting for Production'));\n  assert(dashboardSource.includes('timer_registered'));\n});"""
          new = """test('dashboard does not confirm scheduled sniper without both production timers', () => {\n  assert(dashboardSource.includes(\"data['hasPrepTimer'] != true || data['hasFireTimer'] != true\"));\n  assert(dashboardSource.includes('Production agent has not registered both PREP and FIRE timers yet.'));\n  const statusHelperSource = fs.readFileSync(\n    path.join(repoRoot, 'lib/services/sniper_job_status.dart'),\n    'utf8',\n  );\n  assert(statusHelperSource.includes('Arming Sniper…'));\n  assert(statusHelperSource.includes('Sniper Scheduled'));\n  assert(statusHelperSource.includes('timer_registered'));\n});"""
          if old not in text:
              raise SystemExit('expected dashboard readiness contract block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit readiness contract update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/tests/production_readiness_contract.test.js
          git commit -m "Update dashboard readiness contract for automatic scheduling"
          git push origin HEAD:ui/schedule-sniper-dashboard
