name: production-proof-validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  monitor-safe-prep-proof:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/safe-proof-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      RUNTIME_BASE: https://fairwaysniper-production.up.railway.app
      EXPECTED_SHA: a98ddd305765efd3b60f8f764301ec48d703b985
      PROOF_JOB_ID: safe-prep-proof-20260818-v2
    steps:
      - name: Wait for repaired proof deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            body="$(curl -fsS --max-time 10 "$RUNTIME_BASE/api/version" || true)"
            deployed="$(printf '%s' "$body" | python3 -c 'import json,sys
try: print(json.load(sys.stdin).get("gitHash") or "")
except Exception: print("")')"
            echo "deployment attempt=$attempt sha=${deployed:-unavailable}"
            if [ "$deployed" = "$EXPECTED_SHA" ]; then
              echo "EXPECTED_DEPLOYMENT_SEEN=$deployed"
              exit 0
            fi
            sleep 5
          done
          echo 'Expected Railway deployment was not observed.' >&2
          exit 1

      - name: Observe safe PREP proof through FIRE
        run: |
          set -euo pipefail
          ready_seen=0
          prefire_seen=0
          fire_seen=0
          bad_fire_auth=0
          proof_visible=0

          for attempt in $(seq 1 150); do
            status_code="$(curl -sS --max-time 10 -o proof-status.json -w '%{http_code}' "$RUNTIME_BASE/api/firestore/jobs/$PROOF_JOB_ID/status" || true)"
            events_code="$(curl -sS --max-time 10 -o proof-events.json -w '%{http_code}' "$RUNTIME_BASE/api/firestore/jobs/$PROOF_JOB_ID/events" || true)"

            if [ "$status_code" = '200' ] && [ "$events_code" = '200' ]; then
              proof_visible=1
              python3 - <<'PY'
          import json
          s=json.load(open('proof-status.json'))
          e=json.load(open('proof-events.json'))
          types=[x.get('type') for x in e.get('events',[]) if isinstance(x,dict)]
          print('STATUS', {k:s.get(k) for k in ['status','state','dryRun','proofRun','warmState','brsAuthenticated','secondsUntilPrep','secondsUntilFire','result','bookedTime','lastAgentEvent','lastAgentError','errorMessage']})
          print('EVENTS', types[-15:])
          PY

              if python3 - <<'PY'
          import json
          e=json.load(open('proof-events.json'))
          t=[x.get('type') for x in e.get('events',[]) if isinstance(x,dict)]
          raise SystemExit(0 if 'READY' in t else 1)
          PY
              then ready_seen=1; fi

              if python3 - <<'PY'
          import json
          e=json.load(open('proof-events.json'))
          t=[x.get('type') for x in e.get('events',[]) if isinstance(x,dict)]
          raise SystemExit(0 if 'PREFIRE_VERIFY_FIRED' in t else 1)
          PY
              then prefire_seen=1; fi

              if python3 - <<'PY'
          import json
          e=json.load(open('proof-events.json'))
          t=[x.get('type') for x in e.get('events',[]) if isinstance(x,dict)]
          raise SystemExit(0 if 'FIRE_TIMER_FIRED' in t else 1)
          PY
              then fire_seen=1; fi

              if python3 - <<'PY'
          import json
          e=json.load(open('proof-events.json'))
          t=[x.get('type') for x in e.get('events',[]) if isinstance(x,dict)]
          bad=any(x in t for x in ['BRS_NOT_READY_AT_FIRE_TIME','AUTH_FAILED_AT_FIRE','WARMUP_ERROR_AT_FIRE'])
          raise SystemExit(0 if bad else 1)
          PY
              then bad_fire_auth=1; fi

              if [ "$ready_seen" -eq 1 ] && [ "$prefire_seen" -eq 1 ] && [ "$fire_seen" -eq 1 ]; then
                echo 'Required lifecycle events observed. Waiting 10s for any immediate FIRE recovery signal.'
                sleep 10
                curl -fsS --max-time 10 "$RUNTIME_BASE/api/firestore/jobs/$PROOF_JOB_ID/status" -o proof-status.json
                curl -fsS --max-time 10 "$RUNTIME_BASE/api/firestore/jobs/$PROOF_JOB_ID/events" -o proof-events.json
                break
              fi
            else
              echo "proof attempt=$attempt status_http=$status_code events_http=$events_code"
            fi
            sleep 5
          done

          python3 - <<'PY'
          import json, sys
          s=json.load(open('proof-status.json'))
          e=json.load(open('proof-events.json'))
          types=[x.get('type') for x in e.get('events',[]) if isinstance(x,dict)]
          required=['READY','PREFIRE_VERIFY_FIRED','FIRE_TIMER_FIRED']
          missing=[x for x in required if x not in types]
          bad=[x for x in ['BRS_NOT_READY_AT_FIRE_TIME','AUTH_FAILED_AT_FIRE','WARMUP_ERROR_AT_FIRE'] if x in types]
          print('FINAL_STATUS=', {k:s.get(k) for k in ['status','state','dryRun','proofRun','warmState','brsAuthenticated','fireTimerDriftMs','bookingHotPathDeltaMs','firstBrsActionDeltaMs','result','bookedTime','lastAgentEvent','lastAgentError','errorMessage']})
          print('FINAL_EVENTS=', types)
          if s.get('dryRun') is not True or s.get('proofRun') is not True:
              raise SystemExit('FAIL: safety flags are not both true')
          if s.get('bookedTime') is not None:
              raise SystemExit('FAIL: proof created a booking')
          if missing:
              raise SystemExit('FAIL: missing events ' + ','.join(missing))
          if bad:
              raise SystemExit('FAIL: FIRE auth recovery events ' + ','.join(bad))
          print('SAFE_PREP_PROOF_ACCEPTANCE=PASS')
          PY

      - name: Upload read-only proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-prep-proof-readonly-evidence
          path: |
            proof-status.json
            proof-events.json
          if-no-files-found: ignore
