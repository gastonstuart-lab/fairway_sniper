name: production-proof-validation

on:
  push:
    branches:
      - copilot/production-proof-fairway-sniper
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  agent-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install agent dependencies reproducibly without browser postinstall
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check production agent
        run: node --check index.js
      - name: Syntax check warm-session module
        run: node --check warm_session.js
      - name: Run safety and readiness contracts
        run: npm run test:safety

  flutter-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build web release
        run: flutter build web --release
